plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Общий код вшивается в jar мода.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

// Проверочная съёмка: тот же сценарий, что на Fabric, в jar мода не попадает.
sourceSets {
    shots {
        java.srcDir '../common/src/shots/java'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

// Тот же сценарий съёмки отдельным модом на именах игры — чтобы прогнать готовый jar в чистом NeoForge, как у игрока.
// Кладётся в build/prodlibs, в релиз не попадает: ./gradlew :neoforge:remapShotsJar
def shotsJar = tasks.register('shotsJar', Jar) {
    from sourceSets.shots.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier = 'shots-dev'
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}
tasks.register('remapShotsJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = shotsJar.flatMap { it.archiveFile }
    classpath.from(sourceSets.shots.compileClasspath)
    archiveClassifier = 'shots'
    destinationDirectory = layout.buildDirectory.dir('prodlibs')
}

loom {
    mods {
        zangetsu_shots {
            sourceSet sourceSets.shots
        }
    }
    runs {
        client {
            runDir '../run-neoforge'
        }
        server {
            runDir '../run-neoforge-server'
        }
        // ./gradlew :neoforge:runShots — игра сама проходит сцены мода и делает скриншоты
        shots {
            client()
            name 'Shots'
            source sourceSets.shots
            vmArg '-Dzangetsu.shots=true'
            vmArg "-Dzangetsu.shots.only=${findProperty('shotsOnly') ?: ''}"
            programArgs '--width', '1280', '--height', '720'
            runDir '../run-neoforge-shots'
        }
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
